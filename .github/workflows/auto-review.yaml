name: AutoReview

env:
    PHP_CS_FIXER_IGNORE_ENV: 1

on:
    push:
        branches: [ "main" ]
    pull_request: null
    schedule:
        # Do not make it the first of the month and/or midnight since it is a very busy time
        - cron: "0 10 5 * *"

permissions:
    contents: read

jobs:
    tests:
        runs-on: "ubuntu-latest"
        name: "${{ matrix.check.name }} (PHP ${{ matrix.php }})"
        strategy:
            fail-fast: false
            matrix:
                php: [ "8.4" ]
                check:
                    -   name: "PHPStan"
                        command: "make phpstan"

                    -   name: "CS"
                        command: "make cs_lint"

                    -   name: "PHPUnit AutoReview"
                        command: "make phpunit_autoreview"

                    -   name: "Rector"
                        command: "make rector_lint"

        steps:
            -   name: "Checkout"
                uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09" # v5.1.0
                with:
                    persist-credentials: false

            -   name: "Setup PHP"
                uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
                with:
                    php-version: "${{ matrix.php }}"
                    tools: "composer"

            -   name: "Install Composer dependencies"
                uses: "ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f" # 3.2.1

            -   name: "Install PHP-CS-Fixer dependencies"
                if: "${{ matrix.name == 'CS' }}"
                uses: "ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f" # 3.2.1
                with:
                    working-directory: vendor-bin/php-cs-fixer

            -   name: "Install Rector dependencies"
                if: "${{ matrix.check.name == 'Rector' }}"
                uses: "ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f" # 3.2.1
                with:
                    working-directory: vendor-bin/rector

            -   name: "Run ${{ matrix.check.name }}"
                env:
                    COMMAND: "${{ matrix.check.command }}"
                run: "${COMMAND}"

    zizmor:
        runs-on: "ubuntu-latest"
        name: "zizmor"
        steps:
            -   name: "Checkout"
                uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09" # v5.1.0
                with:
                    persist-credentials: false

            -   name: "Run zizmor"
                uses: "zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b" # v0.8.0
                with:
                    # Fail the job on findings so that the AutoReview Status check blocks
                    # the merge. In the Advanced Security mode, the job never fails:
                    # https://github.com/zizmorcore/zizmor-action#usage-with-github-advanced-security-recommended
                    advanced-security: false

    # This is a "trick", a meta task which does not change, and we can use in
    # the protected branch rules as opposed to the individual tests which
    # may change regularly.
    validate-tests:
        name: "AutoReview Status"
        runs-on: "ubuntu-latest"
        needs:
            - "tests"
            - "zizmor"
        if: "always()"
        steps:
            - name: "Successful run"
              if: "${{ !(contains(needs.*.result, 'failure')) }}"
              run: "exit 0"

            - name: "Failing run"
              if: "${{ contains(needs.*.result, 'failure') }}"
              run: "exit 1"
