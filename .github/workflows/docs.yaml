name: Docs

on:
    push:
        branches: [ "main" ]
    pull_request: null
    schedule:
        # Do not make it the first of the month and/or midnight since it is a very busy time
        - cron: "0 10 5 * *"

permissions:
    contents: read

jobs:
    check-markdown:
        name: "Lint Markdown"
        runs-on: "ubuntu-latest"
        timeout-minutes: 1
        steps:
            -   name: "Checkout repository"
                uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
                with:
                    persist-credentials: false

            -   name: "Check Markdown formatting"
                uses: "DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34" # v25.0.0
                with:
                    globs: "*.md"

    check-links:
        name: "Lint Links"
        runs-on: "ubuntu-latest"
        timeout-minutes: 1
        steps:
            -   name: "Checkout repository"
                uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
                with:
                    persist-credentials: false

            -   name: "Restore lychee cache"
                uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
                with:
                    path: ".lycheecache"
                    key: "cache-lychee-${{ github.sha }}"
                    restore-keys: cache-lychee-

            -   name: "Run Lychee"
                uses: "lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8" # v2.9.0
                with:
                    # To keep in sync with Makefile#lychee
                    args: "--verbose --no-progress --accept '100..=103,200..=299,429' '*.md' --cache --max-cache-age 1d"
                    output: "${{ runner.temp }}/lychee/out.md"
                    fail: true

    # This is a "trick", a meta task which does not change, and we can use in
    # the protected branch rules as opposed to the individual tests which
    # may change regularly.
    validate-tests:
        name: "Docs Status"
        runs-on: "ubuntu-latest"
        needs:
            - "check-markdown"
            - "check-links"
        if: "always()"
        steps:
            - name: "Successful run"
              if: "${{ !(contains(needs.*.result, 'failure')) }}"
              run: "exit 0"

            - name: "Failing run"
              if: "${{ contains(needs.*.result, 'failure') }}"
              run: "exit 1"
