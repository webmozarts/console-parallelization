name: "Tests"

on:
    push:
        branches: ["main"]
    pull_request: null
    schedule:
        # Do not make it the first of the month and/or midnight since it is a very busy time
        - cron: "0 10 5 * *"

permissions:
    contents: read

jobs:
    tests:
        runs-on: "ubuntu-latest"
        name: "Tests (PHP ${{ matrix.php }})"
        strategy:
            fail-fast: false
            matrix:
                php:
                    - "8.3"
                    - "8.4"
                    - "8.5"

        steps:
            -   name: "Check out repository code"
                uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
                with:
                    persist-credentials: false

            -   name: "Setup PHP"
                uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
                with:
                    php-version: "${{ matrix.php }}"
                    tools: "composer"

            -   name: "Install Composer dependencies"
                uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0

            -   name: "Run tests"
                run: "make phpunit"

    symfony-version:
        runs-on: "ubuntu-latest"
        name: "Tests (PHP ${{ matrix.php }}) with Symfony ${{ matrix.symfony.version_name }} (deps: ${{ matrix.dependency-versions }})"
        strategy:
            fail-fast: false
            matrix:
                dependency-versions:
                    - "lowest"
                    - "highest"
                php:
                    - "8.3"
                    - "8.4"
                    - "8.5"
                symfony:
                    - version_name: "6.4"
                      conflict: "<6.4 || >=7.0"
                    - version_name: "7.4"
                      conflict: "<7.4 || >=8.0"
                    - version_name: "8.1"
                      conflict: "<8.1 || >=9.0"
                exclude:
                    -   php: "8.3"
                        symfony:
                            version_name: "8.1"
                            conflict: "<8.1 || >=9.0"

        steps:
            -   name: "Check out repository code"
                uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
                with:
                    persist-credentials: false

            -   name: "Setup PHP"
                uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
                with:
                    php-version: "${{ matrix.php }}"
                    tools: "composer"

            -   name: "Fix the Symfony versions"
                env:
                    SYMFONY_CONFLICT: "${{ matrix.symfony.conflict }}"
                run: "bin/fix-symfony-versions \"${SYMFONY_CONFLICT}\""

            -   name: "Install Composer dependencies"
                uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
                with:
                    dependency-versions: "${{ matrix.dependency-versions }}"

            -   name: "Run tests"
                run: "make phpunit"

    infection:
        runs-on: "ubuntu-latest"
        name: "Infection (PHP ${{ matrix.php }})"
        strategy:
            fail-fast: false
            matrix:
                php:
                    - "8.3"

        steps:
            -   name: "Check out repository code"
                uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
                with:
                    persist-credentials: false

            -   name: "Setup PHP"
                uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
                with:
                    php-version: "${{ matrix.php }}"
                    tools: "composer"
                    coverage: "pcov"

            -   name: "Install Composer dependencies"
                uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0

            -   name: "Run tests with coverage and Infection"
                run: "make infection"

    # This is a "trick", a meta task which does not change, and we can use in
    # the protected branch rules as opposed to the individual tests which
    # may change regularly.
    validate-tests:
        name: "Tests Status"
        runs-on: "ubuntu-latest"
        needs:
            - "tests"
            - "symfony-version"
            - "infection"
        if: "always()"
        steps:
            - name: "Successful run"
              if: "${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')) }}"
              run: "exit 0"

            - name: "Failing run"
              if: "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}"
              run: "exit 1"
